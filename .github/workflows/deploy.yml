name: deploy

# main builds and deploys to Pages; rule validation gates it — CLAUDE.md,
# deployment. `pnpm build` runs `rules:validate` first, so a rule without a
# citation or a precedence conflict fails the deploy rather than shipping.
#
# fixtures:record never runs here: Sastrawi is a development-time oracle, not
# a dependency of this build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is an error. One source of truth for
      # the pnpm version, and it is the one local development already uses.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate rule packs
        run: pnpm rules:validate

      - name: Test
        run: pnpm test:run

      - name: Build static export
        run: pnpm build
        env:
          # Must match the repository name — PRD §11.
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Check .nojekyll exists
        run: test -f out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
